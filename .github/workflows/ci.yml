name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # release-please derives the changelog and the next version from the
      # squashed pull request title, so the title has to parse.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-pins:
    name: Workflow action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the pin check itself
        run: node scripts/test-check-workflow-pins.mjs
      - name: Verify every workflow action is pinned by commit SHA
        run: node scripts/check-workflow-pins.mjs

  standards:
    name: Org standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # The standards CLI declares node >=24; 22 only warns, but the
          # drift lane is repository-level and has no reason to run older.
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json
      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the CLI/stamp alignment class:
      # every verdict of that run was computed against the wrong manifest, so
      # the pull request must not merge. A non-blocking marker is context for
      # the reviewer — the failures it lists are reported by this workflow's own
      # lanes. The marker is parsed rather than matched line by line: JSON may
      # put `"blocking":` and `true` on separate lines, and a guard whose whole
      # purpose is to fail closed must fail on a marker it cannot read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON — ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema — ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "
      # `@sebastian-software/standards` is a pinned, exact devDependency, so
      # this runs the version the lockfile records and CI executes nothing that
      # was not reviewed in a pull request. Renovate's `:standards` preset
      # raises the pin; the drift it then reports is applied in that same pull
      # request.
      - name: "Guard: the pinned standards CLI matches the repository stamp"
        run: |
          node -p "
          const meta = require('./.repometa.json');
          const paths = [process.cwd(), ...(meta.workspaces ?? [])];
          const manifest = require(require.resolve('@sebastian-software/standards/manifest.json', { paths }));
          if (manifest.currentVersion !== meta.standards) {
            throw new Error('The installed @sebastian-software/standards ships manifest version ' + manifest.currentVersion + ', but .repometa.json is stamped ' + meta.standards + '. Raise the pin to the release whose manifest is version ' + meta.standards + ' and refresh the lockfile.');
          }
          'standards CLI and repository stamp are aligned at version ' + meta.standards
          "
      - name: Check org standards
        run: pnpm exec standards check

  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.x is the engines floor, 24.x the version the release publishes on.
        node: ["22.x", "24.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the committed runtime version
        run: |
          pnpm version:sync
          git diff --exit-code src/version.ts
      - name: Run repository checks
        run: pnpm check
